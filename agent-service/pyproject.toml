[project]
name = "ai-product-studio-agent-service"
version = "0.2.0"
description = "LangGraph Product Manager Agent for AI Product Studio"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "langgraph>=0.2,<2.0",
  "pydantic>=2.8,<3.0",
  "httpx>=0.27,<1.0",
  "python-dotenv>=1.0,<2.0",
]

[dependency-groups]
dev = ["pytest>=8.3,<9.0", "ruff>=0.6,<1.0"]
