<!doctype html><html><body><h2>AI Product Studio</h2><p>Import a design-spec JSON payload to create starter frames in the current Figma file.</p><textarea id="payload" style="width:100%;height:280px">{"name":"AI Product Studio","screens":[{"name":"Dashboard","width":1440,"height":900},{"name":"Product Brief","width":1440,"height":900},{"name":"Design Studio","width":1440,"height":900}]}</textarea><button id="import">Import frames</button><script>document.getElementById('import').onclick=()=>{try{const payload=JSON.parse(document.getElementById('payload').value);parent.postMessage({pluginMessage:{type:'IMPORT_DESIGN',payload}},'*')}catch(e){alert('Invalid JSON payload')}};</script></body></html>
